# TaskFlow Pro - Docker Compose for Full-Stack Deployment
# Run with: docker compose up --build -d
#
# Services:
#   postgres   - PostgreSQL 16 database
#   redis      - Redis 7 (Pub/Sub + BullMQ)
#   db-init    - Runs Prisma migrations + seed (one-shot)
#   server     - Express REST API (port 4000) + DAG engine
#   ws-server  - WebSocket server (port 4001) via `ws` package
#   web        - Next.js frontend (port 3000)

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Redis for Pub/Sub and BullMQ ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── Database Initialization (runs once) ─────────────────────────────
  db-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.db-init
    container_name: taskflow-db-init
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@postgres:5432/${POSTGRES_DB:-taskflow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── REST API Server (Express + DAG Engine) ─────────────────────────
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: taskflow-server
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── WebSocket Server (`ws` package) ─────────────────────────────────
  ws-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws-server
    container_name: taskflow-ws-server
    environment:
      NODE_ENV: production
      WS_PORT: 4001
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@postgres:5432/${POSTGRES_DB:-taskflow}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-secret}
    ports:
      - "4001:4001"
    depends_on:
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4001 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Next.js Web Frontend ────────────────────────────────────────────
  # Serves the page and proxies /api -> server, /ws -> ws-server, so the
  # browser stays on one origin. The proxy targets are baked into the build
  # via next.config.js rewrites (API_INTERNAL_URL, WS_INTERNAL_URL).
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/ws}
        API_INTERNAL_URL: http://server:4000
        WS_INTERNAL_URL: http://ws-server:4001
    container_name: taskflow-web
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/ws}
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
      ws-server:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: taskflow-network